name: Relevant Warnings Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review

jobs:
  relevant-warnings:
    name: Relevant Warnings
    runs-on: ubuntu-latest
    continue-on-error: true
    # Skip on the ledoent fork: Overwatch CLI (overwatch.codecov.io/linux/cli)
    # is a sentry-internal endpoint that requires a Codecov enterprise token
    # the fork doesn't have, so the curl returns an HTML/XML AccessDenied
    # body and the bash script trips on "syntax error near unexpected token
    # `<'". The check then renders red on every PR for purely cosmetic
    # reasons and obscures real failures. The workflow stays in the tree
    # so upstream rebases don't conflict.
    if: github.repository == 'getsentry/seer' && github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5
        with:
          python-version: '3.11'

      - name: Install Requirements
        run: |
          pip install -r requirements.txt

      - name: Install Static Analysis Tools
        run: |
          pip install mypy==1.15.0
          pip install ruff==0.11.1

      - name: Install Overwatch CLI
        run: |
          curl -o overwatch-cli https://overwatch.codecov.io/linux/cli
          chmod +x overwatch-cli

      - name: Run Overwatch CLI
        run: |
          ./overwatch-cli \
            --url https://overwatch.codecov.io \
            --auth-token ${{ secrets.OVERWATCH_SENTRY_AUTH_TOKEN }} \
            --organization-slug sentry \
            python \
            --tool mypy,ruff \
            --workdir src
